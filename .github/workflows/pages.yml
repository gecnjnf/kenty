name: Publish KENTY 2.0

on:
  push:
    branches: [kenty-2.0]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: web
        run: npm install
      - name: Build KENTY
        working-directory: web
        env:
          VITE_BASE_PATH: /kenty/
          VITE_SUPABASE_URL: https://xuuarsjrjbtygdxatrsd.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_Ax146oVfOkqafdjmAwqRNA_ee85CJWC
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

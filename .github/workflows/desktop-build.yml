name: KENTY Windows desktop build
on:
  workflow_dispatch:
  pull_request:
    paths: ['desktop/**','web/**','package.json','.github/workflows/desktop-build.yml']
  push:
    branches: [main]
    paths: ['desktop/**','web/**','package.json','.github/workflows/desktop-build.yml']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22,cache: npm}
      - run: npm install
      - run: npm run build
      - run: npm run icon:generate
      - run: npx electron-builder --win nsis --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: KENTY-Windows-${{ github.sha }}
          path: release/*.exe
          if-no-files-found: error

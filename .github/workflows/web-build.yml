name: KENTY Web Build

on:
  push:
    branches: [main, kenty-2.0]
    paths:
      - "web/**"
      - ".github/workflows/web-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "web/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build production bundle
        run: npm run build
